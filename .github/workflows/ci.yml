name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows on purpose: the golden tests in test/goldens were generated here,
    # and font rasterisation differs enough across platforms to fail them on a
    # Linux runner for reasons that have nothing to do with the code.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
