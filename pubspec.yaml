name: qvas
description: "QVAS — ultrafast offline expense tracker."
publish_to: 'none'
version: 0.3.2+27

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  uuid: ^4.6.0
  flutter_localizations:
    sdk: flutter
  share_plus: ^13.3.0
  file_picker: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.0
  flutter_launcher_icons: 0.14.0

# Іконка застосунку. Джерело — assets/icon/source.png (1024×1024); шари для
# адаптивної іконки збираються з нього скриптом tool/build_icon_layers.py.
# Передній шар вписаний у безпечні 66% полотна: вордмарк у джерелі займає 79%
# ширини, і кругла маска лаунчера обрізала б «q» та «s».
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/source.png"
  adaptive_icon_background: "assets/icon/adaptive_background.png"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/icon/adaptive_monochrome.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true

  # Тексти OFL їдуть у бінарник, а не лише лежать у репозиторії: ліцензія
  # вимагає, щоб вони доходили до того, хто отримав шрифт, а шрифт людина
  # отримує в APK. Читає їх LicenseRegistry у main.dart.
  assets:
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/NotoColorEmoji-OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    # Сабсет Noto Color Emoji у форматі COLRv1 (тех. спека п.7): іконки
    # категорій мають виглядати однаково на всіх вендорах, а не як набір
    # HyperOS чи One UI. Файл згенерований — див. tool/build_emoji_font.py.
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji-subset.ttf
